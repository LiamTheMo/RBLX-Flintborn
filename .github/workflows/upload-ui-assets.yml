name: Upload HUD sprites to Roblox
# Manual only. Uploads art/ui/sprites/*.png through Open Cloud with the repository
# secrets and returns the updated src/shared/UI/UiAssetIds.json as an artifact.
# It never commits or publishes: a person commits the ids through the normal
# branch -> version branch -> main flow.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sprite names (empty = every sprite not yet in UiAssetIds.json)"
        required: false
        default: ""
      upload:
        description: "Upload for real (false = dry run)"
        type: boolean
        required: true
        default: false
      inspect:
        description: "Only print Open Cloud details for this asset id (no upload)"
        required: false
        default: ""
      creator:
        description: "Who owns the uploaded sprites"
        type: choice
        options: [group, user]
        default: group

permissions:
  contents: read

concurrency:
  group: upload-ui-assets
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload sprites
        env:
          # A key for uploading assets may differ from the place-publishing key
          # (for example a key created under the group); fall back to the main key.
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_ASSETS_API_KEY || secrets.ROBLOX_API_KEY }}
          # The group id may live in ROBLOX_CREATOR_GROUP_ID, or in the older
          # ROBLOX_CREATOR_USER_ID secret that was first used to hold it.
          GROUP_ID: ${{ secrets.ROBLOX_CREATOR_GROUP_ID || secrets.ROBLOX_CREATOR_USER_ID }}
          USER_ID: ${{ secrets.ROBLOX_CREATOR_USER_ID }}
          CREATOR: ${{ inputs.creator }}
          ONLY: ${{ inputs.only }}
          UPLOAD: ${{ inputs.upload }}
          INSPECT: ${{ inputs.inspect }}
        run: |
          if [ -n "$INSPECT" ]; then
            python3 scripts/roblox_upload_ui_assets.py --inspect "$INSPECT"
            exit 0
          fi
          if [ "$CREATOR" = "group" ]; then
            export ROBLOX_CREATOR_GROUP_ID="$GROUP_ID"
          else
            export ROBLOX_CREATOR_USER_ID="$USER_ID"
          fi
          if [ "$UPLOAD" = "true" ]; then MODE=--upload; else MODE=--dry-run; fi
          python3 scripts/roblox_upload_ui_assets.py "$MODE" --only "$ONLY"
      - name: Return UiAssetIds.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-asset-ids
          path: src/shared/UI/UiAssetIds.json
