name: Upload and place the lobby map
# Manual only. Uploads the exported lobby map (art/roblox/lobby, written by
# art/blender/scripts/export_lobby_roblox.py) and builds Workspace.LobbyMap in the
# lobby place. Returns art/roblox/lobby/asset_ids.json as an artifact; a person
# commits it through the normal branch -> version branch -> main flow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect = read-only report; upload = upload meshes and textures; place = build and save the map; lighting = set and save the lobby lighting; all = upload, place, then lighting"
        type: choice
        options: [inspect, diagnose, uiprobe, upload, place, lighting, all]
        default: inspect
      creator:
        description: "Who owns uploaded assets (must own the experience so the place can load them)"
        type: choice
        options: [group, user]
        default: group

permissions:
  contents: read

jobs:
  lobby-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Modes that save the lobby place take main's script sync lock (deploy.yml's
    # group on main), so a deploy and a map build never save it at the same time.
    # Upload and read-only modes keep this branch's lock.
    concurrency:
      group: ${{ contains(fromJSON('["place", "lighting", "all"]'), inputs.mode) && 'roblox-script-sync-refs/heads/main' || format('roblox-script-sync-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      # Saving a live place is a deploy: only from main. Uploads may run from any branch.
      - name: Place saves only from main
        if: github.ref != 'refs/heads/main' && contains(fromJSON('["place", "lighting", "all"]'), inputs.mode)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "::error::mode $MODE saves the live lobby place; run it from main"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lobby map
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_ASSETS_API_KEY || secrets.ROBLOX_API_KEY }}
          PLACE_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_LOBBY_PLACE_ID }}
          GROUP_ID: ${{ secrets.ROBLOX_CREATOR_ID || secrets.ROBLOX_CREATOR_GROUP_ID || secrets.ROBLOX_CREATOR_USER_ID }}
          USER_ID: ${{ secrets.ROBLOX_CREATOR_USER_ID }}
          CREATOR: ${{ inputs.creator }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 scripts/roblox_lobby_map.py --check
          if [ "$CREATOR" = "group" ]; then
            export ROBLOX_CREATOR_GROUP_ID="$GROUP_ID"
          else
            export ROBLOX_CREATOR_USER_ID="$USER_ID"
          fi
          if [ "$MODE" = "upload" ] || [ "$MODE" = "all" ]; then
            python3 scripts/roblox_lobby_map.py --upload
          fi
          # Place tasks use the place-publishing key (Luau execution, save place).
          export ROBLOX_API_KEY="$PLACE_KEY"
          if [ "$MODE" = "inspect" ]; then
            python3 scripts/roblox_lobby_map.py --inspect
          fi
          if [ "$MODE" = "diagnose" ]; then
            python3 scripts/roblox_lobby_map.py --diagnose
          fi
          if [ "$MODE" = "uiprobe" ]; then
            python3 scripts/roblox_lobby_map.py --uiprobe
          fi
          if [ "$MODE" = "place" ] || [ "$MODE" = "all" ]; then
            python3 scripts/roblox_lobby_map.py --place
          fi
          if [ "$MODE" = "lighting" ] || [ "$MODE" = "all" ]; then
            python3 scripts/roblox_lobby_map.py --lighting
          fi
      - name: Return asset ids
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lobby-asset-ids
          path: art/roblox/lobby/asset_ids.json
          if-no-files-found: warn
